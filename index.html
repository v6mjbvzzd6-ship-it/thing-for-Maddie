<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I love you</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="quiz-screen">
        <h1>💗 Prove It's You 💗</h1>
        <p class="quiz-sub">Answer all 3 correctly to unlock your surprise</p>

        <div class="quiz-question">
            <label for="q1">When did we start dating? (Month Day)</label>
            <input type="text" id="q1" placeholder="e.g. July 1">
        </div>

        <div class="quiz-question">
            <label for="q2">What's my middle name?</label>
            <input type="text" id="q2" placeholder="Type it here">
        </div>

        <div class="quiz-question">
            <label for="q3">What's my favorite color?</label>
            <input type="text" id="q3" placeholder="Type it here">
        </div>

        <button type="button" id="unlock-btn">Unlock 🔓</button>
        <p id="quiz-message"></p>
    </div>

    <div id="main-content" class="hidden">
        <img src="left.jpeg" id="photo-left" alt="us">

        <div id="container">
            <h1>For My Love</h1>

            <div id="countdown-box">
                <p>Time until anniversary:</p>
                <div id="countdown">Loading...</div>
            </div>

            <div id="reason-box">
                <p id="reason-display">Click below for a reason I love you</p>
                <button type="button">Give me a reason</button>

            </div>
        </div>

        <img src="right.jpeg" id="photo-right" alt="us">
    </div>

    <script src="script.js"></script>
</body>
</html>
